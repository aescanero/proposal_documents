name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schemas:
    name: Schemas and registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: pip install check-jsonschema pyyaml

      - name: Schemas are well-formed JSON Schema
        run: |
          for f in schemas/*.schema.json; do
            python -c "import json,sys; json.load(open('$f'))"
            echo "ok  $f"
          done

      - name: Registry is well-formed YAML
        run: |
          for f in registry/*.yaml; do
            python -c "import yaml,sys; yaml.safe_load(open('$f'))"
            echo "ok  $f"
          done

      # Schemas are GENERATED from registry/: a hand-edited enum is a bug (CLAUDE.md,
      # "The registry is load-bearing"). Blocking either way: registry-generate --check
      # once it exists (roadmap phase 2c.1); until then the enum comparison below.
      # A step that only printed a notice would be a gate that cannot run.
      - name: Registry is the source of truth
        run: |
          if command -v registry-generate >/dev/null 2>&1; then
            registry-generate --check
          else
            python .github/scripts/check-registry-enums.py
          fi

      - name: Validate manifests
        run: |
          set -eo pipefail; shopt -s nullglob
          # A glob that matches nothing validates nothing and exits 0. A directory that exists
          # and holds no file of its kind is therefore an error, not a pass; an absent directory
          # is legitimate here (this repository holds no archetypes or bindings) and is reported.
          check() {   # check <schema> <dir> <pattern>
            local schema=$1 dir=$2 files=( $2/$3 )
            if [ ! -d "$dir" ]; then echo "$dir/$3: directory absent, 0 files"; return 0; fi
            if [ ${#files[@]} -eq 0 ]; then echo "::error::$dir exists but $dir/$3 matches nothing"; return 1; fi
            check-jsonschema --schemafile "$schema" "${files[@]}"
            echo "$dir/$3: ${#files[@]} file(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          check schemas/archetype-manifest.schema.json  archetypes        '*/manifest.yaml'
          check schemas/component.schema.json           components        '*/component.yaml'
          check schemas/environment-binding.schema.json environments      '*/binding.yaml'
          check schemas/pool-ledger.schema.json         cmdb-data/pools   '*.json'
          check schemas/cmdb-stack.schema.json          cmdb-data/stacks  '*.json'
        shell: bash

  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conftest
        run: |
          VERSION=0.70.1
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin conftest

      # A rule that never fires gives false confidence. Risk R36.
      - name: Policy unit tests
        run: |
          if compgen -G "policy/*.rego" > /dev/null; then
            conftest verify --policy policy/
          else
            echo "::notice::no policies yet (roadmap phase 2c.3)"
          fi
        shell: bash
