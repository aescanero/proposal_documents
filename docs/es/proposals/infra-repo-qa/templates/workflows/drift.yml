# Destino: .github/workflows/drift.yml — arquitectura §14.3
name: drift
on:
  schedule:
    - cron: "17 5 * * *"                       # diario, fuera del minuto 0
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  drift:                                       # un job por entorno, con su identidad de solo lectura
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(vars.DRIFT_ENVS) }}  # variable del repositorio: ["landing-zone","qa"]; prod va aparte
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with:
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: tf-plan-${{ matrix.env == 'landing-zone' && 'lz' || matrix.env }}@${{ vars.GCP_LZ_PROJECT }}.iam.gserviceaccount.com

      - name: Detectar drift y registrarlo
        id: drift
        run: |
          # el bootstrap sí se incluye: el drift de la federación también se quiere ver
          terramate run --tags ${{ matrix.env }} --enable-sharing -- \
            archetypectl cmdb observe --drift --out "$RUNNER_TEMP/observed"
          # por stack: tofu plan -detailed-exitcode -lock=false; salida 2 → outcome drifted, driftAt
          if grep -rqs '"outcome": "drifted"' "$RUNNER_TEMP/observed"; then
            echo "::warning::drift en ${{ matrix.env }}"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cmdb-observed-${{ github.run_id }}-${{ matrix.env }}
          path: ${{ runner.temp }}/observed

      - if: steps.drift.outputs.drifted == 'true'
        run: exit 1

  drift-prod:                                  # prod: sin aprobación, pero solo desde main (DR7)
    runs-on: ubuntu-latest
    environment: prod-drift                    # política de ramas: solo main
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with:
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: tf-plan-prod@${{ vars.GCP_LZ_PROJECT }}.iam.gserviceaccount.com

      - name: Detectar drift y registrarlo
        id: drift
        run: |
          # el bootstrap sí se incluye: el drift de la federación también se quiere ver
          terramate run --tags prod --enable-sharing -- \
            archetypectl cmdb observe --drift --out "$RUNNER_TEMP/observed"
          # por stack: tofu plan -detailed-exitcode -lock=false; salida 2 → outcome drifted, driftAt
          if grep -rqs '"outcome": "drifted"' "$RUNNER_TEMP/observed"; then
            echo "::warning::drift en prod"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cmdb-observed-${{ github.run_id }}-prod
          path: ${{ runner.temp }}/observed

      - if: steps.drift.outputs.drifted == 'true'
        run: exit 1

  cmdb:
    needs: [drift, drift-prod]
    if: ${{ !cancelled() }}
    permissions: { contents: write }
    uses: ./.github/workflows/cmdb-sync.yml
    with:
      pattern: cmdb-observed-${{ github.run_id }}-*
