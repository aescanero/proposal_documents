# Destination: disasterproject/ci-workflows/.github/workflows/appsec.yml
# Reusable workflow for application repositories: SCA and secrets (Trivy),
# the repository's IaC (Checkov) and the image (Trivy). SonarQube stays in its own workflow
# (sonarqube-qa §4.11). On pull requests: gates. On main: also the upload to DefectDojo.
name: appsec
on:
  workflow_call:
    inputs:
      product-type:
        description: Owning team (teams.yaml)
        type: string
        required: true
      product:
        description: Application; by default, the repository's name
        type: string
        default: ${{ github.event.repository.name }}
      image:
        description: Image built in this run, by digest (registry/path@sha256:…); empty if none
        type: string
        default: ""
    secrets:
      DEFECTDOJO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  dependencies:                                # SCA and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2               # trivy and checkov pinned in .mise.toml
      - name: Trivy fs — dependencies and secrets
        env:
          TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}             # copy in Artifact Registry
          TRIVY_JAVA_DB_REPOSITORY: ${{ vars.TRIVY_JAVA_DB_REPOSITORY }}
        run: |
          trivy fs --scanners vuln,secret --format json --output trivy-fs.json .
          # gate: CRITICAL with a fixed version (jq over the report, no second scan)
          n="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")] | length' trivy-fs.json)"
          [ "$n" -eq 0 ] || { echo "::error::$n CRITICAL vulnerabilities with a fix available"; exit 1; }
          # gate: secrets, always
          if jq -e '[.Results[]?.Secrets[]?] | length > 0' trivy-fs.json >/dev/null; then
            echo "::error::secrets in the repository"; exit 1
          fi
      - uses: disasterproject/ci-workflows/.github/actions/defectdojo-upload@v1
        if: ${{ !cancelled() }}
        with:
          url: ${{ vars.DEFECTDOJO_URL }}
          token: ${{ secrets.DEFECTDOJO_TOKEN }}
          file: trivy-fs.json
          scan-type: Trivy Scan
          product-type: ${{ inputs.product-type }}
          product: ${{ inputs.product }}
          test-title: trivy-fs

  iac:                                         # Dockerfile, Helm overlays, workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Checkov
        env:
          BLOCKING: ${{ vars.CHECKOV_BLOCKING_CHECKS }}
        run: |
          checkov -d . --framework dockerfile,helm,kubernetes,github_actions \
            --output json --output-file-path . --soft-fail
          mv results_json.json checkov.json
          # gate: only the checks the platform declares blocking (organisation variable)
          if [ -n "$BLOCKING" ]; then
            checkov -d . --framework dockerfile,helm,kubernetes,github_actions \
              --check "$BLOCKING" --compact --quiet
          fi
      - uses: disasterproject/ci-workflows/.github/actions/defectdojo-upload@v1
        if: ${{ !cancelled() }}
        with:
          url: ${{ vars.DEFECTDOJO_URL }}
          token: ${{ secrets.DEFECTDOJO_TOKEN }}
          file: checkov.json
          scan-type: Checkov Scan
          product-type: ${{ inputs.product-type }}
          product: ${{ inputs.product }}
          test-title: checkov

  image:                                       # container built in this run
    if: inputs.image != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                          # Artifact Registry read through federation
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: google-github-actions/auth@v2    # coordinates committed here, never the caller's variables (landing-zone-qa DZ12)
        with:
          workload_identity_provider: projects/000000000000/locations/global/workloadIdentityPools/gh-disasterproject-infra/providers/github-apps   # provider for application repositories: owner id + allowlist (landing-zone-qa §5.1)
          service_account: image-scan@disasterproject-lz.iam.gserviceaccount.com   # read-only, the apps repository only
      - name: Trivy image
        env:
          TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}
          TRIVY_JAVA_DB_REPOSITORY: ${{ vars.TRIVY_JAVA_DB_REPOSITORY }}
          IMAGE: ${{ inputs.image }}
        run: |
          trivy image --format json --output trivy-image.json "$IMAGE"
          # gate: CRITICAL with a fixed version (jq over the report, no second scan)
          n="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")] | length' trivy-image.json)"
          [ "$n" -eq 0 ] || { echo "::error::$n CRITICAL vulnerabilities with a fix available"; exit 1; }
      - uses: disasterproject/ci-workflows/.github/actions/defectdojo-upload@v1
        if: ${{ !cancelled() }}
        with:
          url: ${{ vars.DEFECTDOJO_URL }}
          token: ${{ secrets.DEFECTDOJO_TOKEN }}
          file: trivy-image.json
          scan-type: Trivy Scan
          product-type: ${{ inputs.product-type }}
          product: ${{ inputs.product }}
          test-title: trivy-image
