# Destination: .github/workflows/image-mirror.yml — third-party image mirroring (landing-zone-qa §6.2)
name: image-mirror
on:
  push:
    branches: [main]
    paths: [images/third-party.yaml]
  schedule:
    - cron: "43 4 * * 1"                       # weekly: repairs a copy deleted by hand
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: image-mirror                  # image-mirror@ can only be impersonated from here
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          identity: image-mirror
          env: ""
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Copy by digest and check it
        env:
          DEST: europe-west1-docker.pkg.dev/${{ steps.setup.outputs.project }}/third-party
        run: |
          # images/third-party.yaml: [{source: quay.io/jetstack/cert-manager-controller, tag: v1.16.2, digest: "sha256:…"}]
          yq -o=json '.[]' images/third-party.yaml | jq -c . | while read -r img; do
            src="$(jq -r .source <<<"$img")"; tag="$(jq -r .tag <<<"$img")"; want="$(jq -r .digest <<<"$img")"
            got="$(crane digest "$src:$tag")"
            if [ "$got" != "$want" ]; then
              echo "::error::$src:$tag publishes $got, $want was declared"; exit 1
            fi
            crane copy "$src@$want" "$DEST/${src#*/}:$tag"
          done
