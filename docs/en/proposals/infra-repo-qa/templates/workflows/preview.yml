# Destination: .github/workflows/preview.yml — architecture §14.1
name: preview
on:
  pull_request:                # every base branch: a pull request stacked on another runs the same gates

permissions:
  contents: read
  pull-requests: write
  id-token: write                              # used only by the plan jobs

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true                     # a new push makes the previous preview obsolete

jobs:
  gates:                                       # G0 and G1, no cloud credentials
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.envs.outputs.envs }}     # non-production and landing-zone
      prod: ${{ steps.envs.outputs.prod }}     # "true" if the PR touches prod
      federation: ${{ steps.fed.outputs.live }}   # "false" only while ci/federation.env holds the placeholder (bootstrap PR)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }               # change detection needs history
      - uses: ./.github/actions/setup

      - name: Is the federation live? (a committed, reviewed state, never a missing variable)
        id: fed
        run: |
          source ci/federation.env
          if [[ "$GCP_LZ_PROJECT_NUMBER" =~ ^0+$ ]]; then echo live=false; else echo live=true; fi >> "$GITHUB_OUTPUT"

      - name: G0 — generated code is current
        run: |
          terramate generate --detailed-exit-code || {
            echo "::error::Generated code is stale. Run 'terramate generate' and commit."
            exit 1
          }
          ./ci/hydrate.sh                      # the charts, rendered as they will be applied (source-hydration DH3)
          if [ -n "$(git status --porcelain -- '*/_rendered/*')" ]; then
            echo "::error::_rendered/ is stale. Run ci/hydrate.sh and commit."; git status --short -- '*/_rendered/*'; exit 1
          fi

      - name: G1 — structure, composition, ordering
        run: ./ci/g1.sh

      - name: Checkov (static)
        run: checkov -d stacks --framework terraform --config-file .checkov/gcp.yaml

      - name: Environments this PR touches
        id: envs
        run: |
          envs=(); prod=false
          for e in landing-zone $(ls environments); do
            [ -n "$(terramate list --changed --tags "$e")" ] || continue
            if [ "$e" = prod ]; then prod=true; else envs+=("$e"); fi
          done
          echo "envs=$(jq -cn '$ARGS.positional' --args "${envs[@]}")" >> "$GITHUB_OUTPUT"
          echo "prod=$prod" >> "$GITHUB_OUTPUT"

  spec-pin:                                    # its own job: the specification's checkout holds poc/, a Terramate root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4                # the specification, to check the pin both ways (DR4)
        with: { repository: aescanero/proposal_documents, path: .spec, fetch-depth: 0 }   # a read-only token if it is private
      - name: registry/ and schemas/ match their pin (DR4)
        run: ./ci/spec-sync.sh --check && ./ci/spec-sync.sh --upstream .spec

  plan:                                        # one job per touched environment, with its read-only identity
    needs: gates
    if: needs.gates.outputs.envs != '[]' && needs.gates.outputs.federation == 'true'
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.gates.outputs.envs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with:
          identity: tf-plan
          env: ${{ matrix.env }}

      - name: Plan with sharing and mocks, this environment's stacks only
        run: terramate script run --changed --tags ${{ matrix.env }} tofu preview

      - name: G2 — Checkov on the plan
        run: |
          terramate run --changed --tags ${{ matrix.env }} -- sh -c '
            tofu show -json out.tfplan > plan.json &&
            checkov -f plan.json --framework terraform_plan
          '

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.env }} — changed stacks, in execution order"
            echo '```'
            terramate list --changed --tags ${{ matrix.env }} --run-order
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plan-prod:                                   # prod: the same plan, with approval (DR7)
    needs: gates
    if: needs.gates.outputs.prod == 'true' && needs.gates.outputs.federation == 'true'
    runs-on: ubuntu-latest
    environment: prod-plan                     # tf-plan-prod@ can only be impersonated from here
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with:
          identity: tf-plan
          env: prod

      - name: Plan with sharing and mocks, this environment's stacks only
        run: terramate script run --changed --tags prod tofu preview

      - name: G2 — Checkov on the plan
        run: |
          terramate run --changed --tags prod -- sh -c '
            tofu show -json out.tfplan > plan.json &&
            checkov -f plan.json --framework terraform_plan
          '

      - name: Summary
        run: |
          {
            echo "### prod — changed stacks, in execution order"
            echo '```'
            terramate list --changed --tags prod --run-order
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
