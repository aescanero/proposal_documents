# Destination: .github/workflows/apply-env.yml — one environment, one identity, one gate
name: apply-env
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      base:                                    # commit of env's last successful deploy
        type: string
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}             # reviewers; puts environment=<env> in the OIDC token
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false                # never cut an apply halfway
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with:
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_APPLY_SA }}   # Environment variable: tf-apply-<env>@…

      - name: Generated code is current
        run: terramate generate --detailed-exit-code

      - name: Apply changed stacks, mocks off
        id: apply
        run: terramate script run --changed -B "${{ inputs.base }}" --tags "${{ inputs.env }}" --no-tags bootstrap tofu deploy

      - name: CMDB observations
        if: ${{ !cancelled() }}                # also after a failed apply: it records outcome failed
        run: |
          terramate run --changed -B "${{ inputs.base }}" --tags "${{ inputs.env }}" --no-tags bootstrap -- \
            archetypectl cmdb observe --out "$RUNNER_TEMP/observed"

      - name: Deploy marker
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}   # the apply, not the job: a failed observation does not hold the marker back
        run: |
          mkdir -p "$RUNNER_TEMP/observed/deployed"
          jq -n --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_NUMBER" '{sha: $sha, run: $run}' \
            > "$RUNNER_TEMP/observed/deployed/${{ inputs.env }}.json"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cmdb-observed-${{ github.run_id }}-${{ inputs.env }}
          path: ${{ runner.temp }}/observed
