# Destination: .github/workflows/first-deploy.yml — staged first deployment (architecture §4.11)
name: first-deploy
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment deployed for the first time
        type: choice
        options: [landing-zone, qa, prod]      # extended when each environment is onboarded

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Only from main, and only if the environment was never deployed
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::first-deploy only runs from main"; exit 1; }
          ./ci/fetch-observed.sh
          if git show "origin/cmdb-observed:cmdb-data/observed/deployed/${{ inputs.env }}.json" >/dev/null 2>&1; then
            echo "::error::${{ inputs.env }} already has a deploy marker: deploy applies its changes"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_APPLY_SA }}

      - name: Generated code is current
        run: terramate generate --detailed-exit-code

      - name: Staged apply
        id: apply
        env:
          ENV: ${{ inputs.env }}
        run: |
          if [ "$ENV" = landing-zone ]; then
            # no clusters: one ordered pass, without the bootstrap (DZ8)
            terramate script run --tags landing-zone --no-tags bootstrap tofu deploy
          else
            # a consumer's provider cannot reach a cluster that does not exist yet: by layers
            for layer in network cluster platform-services; do
              terramate script run --tags "gcp:$ENV:$layer" tofu deploy
            done
            terramate script run --tags "$ENV" tofu deploy   # instances and whatever remains
          fi

      - name: CMDB observations
        if: ${{ !cancelled() }}
        run: |
          terramate run --tags "${{ inputs.env }}" --no-tags bootstrap -- \
            archetypectl cmdb observe --out "$RUNNER_TEMP/observed"

      - name: First deploy marker
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}   # the apply, not the job: a failed observation does not hold the marker back
        run: |
          mkdir -p "$RUNNER_TEMP/observed/deployed"
          jq -n --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_NUMBER" '{sha: $sha, run: $run}' \
            > "$RUNNER_TEMP/observed/deployed/${{ inputs.env }}.json"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cmdb-observed-${{ github.run_id }}-${{ inputs.env }}
          path: ${{ runner.temp }}/observed

  cmdb:
    needs: apply
    if: ${{ !cancelled() }}
    permissions: { contents: write }
    uses: ./.github/workflows/cmdb-sync.yml
    with:
      pattern: cmdb-observed-${{ github.run_id }}-*
