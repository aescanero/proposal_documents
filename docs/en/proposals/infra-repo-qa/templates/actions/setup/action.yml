# Destination: .github/actions/setup/action.yml
name: setup
description: Tools pinned by mise and, if asked, a GCP identity for one environment
inputs:
  service-account:
    description: Service account to impersonate. Empty = no cloud credentials
    required: false
    default: ""
  workload-identity-provider:
    description: Federation provider (repository variable GCP_WIF_PROVIDER)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2                 # pins terramate, tofu, checkov, conftest, archetypectl
    - if: inputs.service-account != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
